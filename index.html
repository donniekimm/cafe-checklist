<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist">
<title>Cafe Shift Checklist</title>
<style>
  /* Look: Square POS style. System font, gray page, white cards, blue main action.
     Every tap target is at least 44px tall for the iPad. */
  :root {
    --blue: #006aff;
    --blue-dark: #0055cc;
    --blue-tint: #e5f0ff;
    --green: #00892e;
    --green-tint: #e0f5e7;
    --red: #bf0020;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --fill: #f0f0f0;
    --line: #e1e1e1;
    --page: #f5f5f5;
    --top: calc(72px + env(safe-area-inset-top));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.3;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    /* iPad: no double-tap zoom, no text-selection popup on long press */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  button:disabled { cursor: default; }
  main { max-width: 1080px; margin: 0 auto; padding: calc(var(--top) + 24px) 24px 80px; }
  body.owner-mode #close, body.owner-mode #checklist { display: none; }
  body:not(.owner-mode) #owner-page { display: none; }

  /* Top bar */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    height: var(--top);
    padding: env(safe-area-inset-top) 16px 0;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  #day { flex: 1; text-align: center; font-size: 16px; font-weight: 500; color: var(--muted); }
  #owner, #close { height: 48px; padding: 0 20px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  #owner { background: var(--fill); }
  #owner:active { background: var(--line); }
  #close { background: var(--blue); color: #fff; }
  #close:active { background: var(--blue-dark); }
  #close:disabled { background: var(--fill); color: var(--muted); }

  header { margin-bottom: 20px; }
  header h1 { margin: 0 0 6px; font-size: 30px; font-weight: 700; }
  header p { margin: 0; color: var(--muted); }
  .bar { height: 8px; margin-top: 10px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); }

  /* Dropdowns: shifts, tasks, and the owner's days */
  details.section {
    margin: 12px 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }
  details.section > summary, details.task > summary {
    display: flex;
    align-items: center;
    gap: 12px;
    list-style: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  details.section > summary { min-height: 72px; padding: 12px 20px; font-size: 21px; font-weight: 600; }
  details.task > summary { min-height: 60px; padding: 8px 20px; font-size: 18px; font-weight: 600; }
  #owner-page details.section > summary { min-height: 60px; font-size: 18px; }
  summary::-webkit-details-marker { display: none; }
  summary .label { flex: 1; display: flex; align-items: center; gap: 10px; }
  summary::after {
    content: "";
    flex: none;
    width: 10px;
    height: 10px;
    margin: -4px 4px 0 4px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
  }
  details[open] > summary::after { margin-top: 4px; transform: rotate(-135deg); }
  .count {
    flex: none;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--fill);
    color: var(--muted);
    font-size: 15px;
    font-weight: 500;
  }
  details.done > summary .count { background: var(--green-tint); color: var(--green); }
  details.done > summary .label::before, .step.done .name::before { background: var(--green); border-color: var(--green); color: #fff; content: "✓"; }
  details.done > summary .label::before {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 15px;
    line-height: 26px;
    text-align: center;
  }

  .task { border-top: 1px solid var(--line); }
  .task-body { padding: 0 20px 8px; }
  .check-off {
    flex: none;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 6px;
    background: var(--blue-tint);
    color: var(--blue);
    font-size: 15px;
    font-weight: 600;
  }
  .check-off:active { background: #cfe2ff; }
  details.task:not([open]) .check-off { display: none; }

  /* One step: name on the left, who signed on the right */
  .step {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42%;
    align-items: center;
    gap: 16px;
    min-height: 60px;
  }
  .step + .step { border-top: 1px solid var(--line); }
  .do { text-align: left; }
  .do:active { opacity: 0.6; }
  .do:disabled { opacity: 1; }
  .name { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; font-weight: 500; }
  .name::before {
    content: "";
    flex: none;
    width: 26px;
    height: 26px;
    border: 2px solid #b5b5b5;
    border-radius: 50%;
    font-size: 15px;
    line-height: 22px;
    text-align: center;
  }
  .step.plain .name::before { display: none; }
  .hint { min-height: 60px; text-align: right; color: var(--blue); font-size: 15px; font-weight: 600; }
  .hint:disabled { color: var(--muted); font-weight: 400; }
  .saved { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; padding: 8px 0; }
  .chip { min-height: 44px; padding: 0 12px; border-radius: 6px; background: var(--fill); font-size: 15px; font-weight: 500; }
  .chip:active { background: var(--line); }
  .chip b { margin-left: 4px; color: var(--blue); font-weight: 600; }

  /* Break schedule: same rows and columns as the paper sheet */
  .break-wrap { padding: 0 20px 14px; border-top: 1px solid var(--line); }
  .break-table { margin-top: 16px; table-layout: fixed; border: 1px solid #b5b5b5; }
  .break-table th {
    padding: 0;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-align: center;
    text-transform: uppercase;
  }
  .break-head { display: block; width: 100%; min-height: 48px; padding: 4px 8px; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  .break-table td, .break-table tr:last-child td { padding: 0; border: 1px solid #b5b5b5; }
  .break-cell { display: block; width: 100%; min-height: 56px; padding: 6px 8px; font-weight: 500; text-align: center; }
  .break-cell:active { background: var(--fill); }
  .break-cell.empty { color: #8a8a8a; font-weight: 400; }
  .break-note { margin: 10px 0 0; color: var(--muted); font-size: 14px; font-style: italic; }

  /* Lobby / Restroom check log: same rows and columns as the paper sheet */
  .log-desc { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; color: var(--muted); font-size: 14px; }
  .log-desc h4 { margin: 0 0 2px; color: var(--ink); font-size: 14px; font-weight: 600; }
  .log-desc ul { margin: 0; padding-left: 18px; }
  .log-rule { margin: 10px 0 0; color: var(--muted); font-size: 14px; font-style: italic; }
  .log-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .log-table { min-width: 620px; margin-top: 10px; }
  .log-table th { padding: 14px 6px; font-size: 13px; }
  .log-table th:first-child { width: 13%; }
  .log-table th:nth-child(2) { width: 22%; }
  .log-table th:nth-child(3), .log-table th:nth-child(4) { width: 20%; }
  .log-time { font-size: 15px; font-weight: 600; text-align: center; }
  .log-table td.log-cell { position: relative; height: 56px; }
  .log-check { position: absolute; inset: 0; width: 100%; height: 100%; color: #fff; font-size: 28px; font-weight: 700; }
  .log-check:active { background: var(--fill); }
  .log-check.on, .log-check.on:active { background: var(--green); }
  .log-note {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 6px 8px;
    border: none;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 16px; /* 16px+ so iPad Safari doesn't zoom in on focus */
  }
  .log-note:focus { outline: 2px solid var(--blue); outline-offset: -2px; }
  .log-note:disabled { -webkit-text-fill-color: var(--ink); opacity: 1; }

  /* Apple-style context menu */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.06);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .menu {
    position: fixed;
    width: 280px;
    overflow-y: auto;
    border-radius: 13px;
    background: rgba(250, 250, 250, 0.88);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.12);
    transform-origin: top left;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .menu .head {
    padding: 10px 16px 8px;
    font-size: 13px;
    color: #6e6e73;
    border-bottom: 0.5px solid rgba(60, 60, 67, 0.29);
  }
  .menu button {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 12px 16px;
    font-size: 17px;
    text-align: left;
    border-bottom: 0.5px solid rgba(60, 60, 67, 0.29);
  }
  .menu button:last-child { border-bottom: none; }
  .menu button:active { background: rgba(0, 0, 0, 0.08); }
  .menu button.done { color: #8e8e93; cursor: default; }
  .menu button[data-name="Clear"] { color: var(--red); font-weight: 600; }
  .time-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-bottom: 0.5px solid rgba(60, 60, 67, 0.29);
  }
  .time-row:last-child { border-bottom: none; }
  .menu .time-row button { width: auto; min-height: 44px; align-items: center; padding: 0 0 0 16px; border: none; color: var(--red); font-size: 15px; font-weight: 600; }

  /* Owner passcode keypad */
  .passcode {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 28px 28px 22px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.22);
    text-align: center;
  }
  .passcode h2 { margin: 0 0 16px; font-size: 21px; font-weight: 600; }
  .dots { display: flex; justify-content: center; gap: 18px; margin-bottom: 24px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--ink); }
  .dots.shake { animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .keys { display: grid; grid-template-columns: repeat(3, 96px); gap: 10px; }
  .keys button { height: 72px; border-radius: 6px; background: var(--fill); font-size: 26px; font-weight: 500; }
  .keys button:active { background: var(--line); }
  .keys button.text { background: none; color: var(--blue); font-size: 16px; font-weight: 600; }

  /* Owner report page */
  #owner-page h2 { margin: 32px 0 10px; font-size: 21px; font-weight: 600; }
  #owner-page p { margin: 8px 0; }
  #owner-page header p { margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stats div { padding: 16px 20px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .stats b { display: block; font-size: 32px; font-weight: 700; }
  .stats span { color: var(--muted); font-size: 15px; }
  .report-body { padding: 4px 20px 16px; border-top: 1px solid var(--line); }
  .report-body h4 { margin: 16px 0 6px; font-size: 17px; font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; background: #fff; }
  th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
  tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-weight: 600; }
  .actions { display: flex; gap: 12px; margin-top: 16px; }
  .actions button, .remove-emp {
    min-height: 48px;
    padding: 0 18px;
    border-radius: 6px;
    background: var(--fill);
    font-weight: 600;
  }
  .remove-emp { min-height: 44px; color: var(--red); font-size: 15px; }
  .notice { padding: 14px 18px; border-radius: 8px; background: var(--blue-tint); font-weight: 500; }

  /* Owner: add / remove employees */
  .add-row { display: flex; gap: 12px; margin: 12px 0; }
  .add-row input {
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #b5b5b5;
    border-radius: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 17px; /* 16px+ so iPad Safari doesn't zoom in on focus */
  }
  .add-row button { min-height: 48px; padding: 0 22px; border-radius: 6px; background: var(--blue); color: #fff; font-weight: 600; }
  .emp { display: flex; justify-content: space-between; align-items: center; min-height: 60px; }
  .emp + .emp, .add-row + .emp { border-top: 1px solid var(--line); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 60;
    transform: translateX(-50%);
    padding: 12px 20px;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    display: none;
  }

  /* Phones, for anyone viewing the demo away from the iPad */
  @media (max-width: 640px) {
    main { padding-left: 12px; padding-right: 12px; }
    #day { font-size: 13px; }
    #owner, #close { padding: 0 12px; font-size: 15px; }
    .step { display: block; padding-bottom: 8px; }
    .hint { min-height: 36px; padding-left: 38px; text-align: left; }
    .saved { justify-content: flex-start; padding: 0 0 0 38px; }
    .step.plain .hint, .step.plain .saved { padding-left: 0; }
    .stats { grid-template-columns: 1fr; }
    .log-desc { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="topbar">
  <button id="owner">Owner</button>
  <div id="day"></div>
  <button id="close">Finish Day</button>
</div>
<main id="checklist">
  <header>
    <h1>Shift Checklist</h1>
    <p id="progress"></p>
    <div class="bar"><i id="bar"></i></div>
  </header>
  <div id="sections"></div>
</main>
<main id="owner-page">
  <header>
    <h1>Owner Report</h1>
    <p id="sheet-status"></p>
  </header>
  <div id="report"></div>
</main>
<div id="toast"></div>

<script>
// Google Sheet that receives the weekly report. Paste the Apps Script web app URL here
// (set it up with google-apps-script.gs — steps are at the top of that file).
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyynLF608zt5_9g7xR_hG9EtN3jCMXtEtbobwuqOvV3HClYVHebyfszgacW9-y3inJTQg/exec';

// Passcodes for the Owner button. Anyone who opens the page's code can read these two.
// OWNER_CODE is only the starting code: the owner's own code is saved on the iPad.
const OWNER_CODE = '1111';
// Developer's recovery code. Always works, so a forgotten owner code can be changed.
const DEVELOPER_CODE = '1030';

// Shift shown next to the clock (24-hour "HH:MM"; start included, end not). Outside these: "Closed".
const SHIFT_TIMES = [
  { label: 'Morning', start: '06:45', end: '07:00' },
  { label: 'Mid-Shift', start: '07:00', end: '18:00' },
  { label: 'Closing', start: '18:00', end: '20:00' },
];

// Starting staff list. Owners add and remove people on the Owner page (saved on the iPad).
const DEFAULT_EMPLOYEES = [
  'Donnie Kim', 'Mauricio Ochoa Peralta', 'Bella Holland', 'Sonia Lim', 'Yumi Jang', 'Zane Penny',
  'Shanon Cho', 'Devin Teramoto', 'William Yi', 'Erin Jang', 'Michael Park',
];

// Check log, same as the paper sheet: every 2 hours, one box for each area.
const LOG_TASK = 'Lobby / Restroom Check Log';
const UNASSIGNED = 'Unassigned'; // a box checked with nobody in Assigned To
const LOG_TIMES = ['8:00 AM', '10:00 AM', '12:00 PM', '2:00 PM', '4:00 PM', '6:00 PM', '8:00 PM'];
const LOG_AREAS = ['Restroom', 'Lobby & Floor'];
const LOG_CHECKS = [
  ['Lobby & Floor', ['Collect dishes & wipe down all tables (including patio)',
    'Check floors (spot clean if needed)', 'Maintain clean customer area']],
  ['Restroom', ['Check toilet paper (min. 2 rolls)', 'Refill paper towels & soap',
    'Clean mirror & sink', 'Check floor / trash / odor']],
];

const SHIFTS = [
  { id: 'opening', short: 'Opening', label: 'Opening Tasks', tasks: [
    { name: 'Open', steps: ['Clock in', 'Music ON', 'Lights ON (all areas)'] },
    { name: 'Equipment', steps: ['Espresso machine ON (1.5 bar / 200°F / 12 bar)', 'Grinder ON (open hopper)',
      'Marco boiler ON', 'Bakery fan & case light ON', 'MerryChef → 500°F → clean inside and outside'] },
    { name: 'Store Setup', steps: ['Dishwasher ON', 'Unlock doors (4) + open sign', 'Outdoor furniture setup'] },
    { name: 'Batch Brew', steps: ['80 g coffee + 1400 g water / rinse server', 'Press "Custom"'] },
    { name: 'Pastry', steps: ['Display pastries', 'Financiers (each flavor + stock 3)', 'Prep salad and dressing'] },
    { name: 'Matcha / Back Bar', steps: ['Bowl / whisk / holder / sieve / spoon / kettle / scales'] },
    { name: 'Ice Bin', steps: ['Clean ice bin / refill completely with fresh ice'] },
    { name: 'Sanitizer', steps: ['Red bucket + 1 tablet in hot water', 'Place under espresso'] },
    { name: 'Bathroom', steps: ['2 toilet paper', 'Paper towels / soap', 'Clean mirror & sink', 'Check floor / trash / odor'] },
    { name: 'Cleaning', steps: ['Tables / floors / vacuum lobby', 'Wipe doors, whole pastry case, sandwich case',
      'Wipe fingerprints off POS system'] },
    { name: 'Water Station', steps: ['Refill completely with fresh water and ice, restock cups'] },
    { name: 'Cold Brew Stock & TDS', steps: ['Inventory TDS (2.50) check / make cold brew as needed (fewer than 4 full jugs in fridge)'] },
  ] },
  // repeats: done again and again through the shift, so no green "done" marks.
  { id: 'mid', short: 'Mid-Shift', label: 'Mid-Shift Tasks', repeats: true, tasks: [
    { name: LOG_TASK, checkLog: true, steps: LOG_TIMES.flatMap(time => LOG_AREAS.map(area => `${time} ${area}`)) },
    { name: 'Restock (Front & Back)', steps: ['Milks (all types)', 'Tonic / coconut water', 'Cups / lids / sleeves',
      'Utensils / napkins', 'Restocking shipments (when received)', "Sticker cups (when there's down time)"] },
    { name: 'Bar Maintenance', steps: ['Clean espresso station', 'Check grinder area (no buildup)', 'Wipe steam wands & trays',
      'Organize back bar (matcha tools, kettles)', 'Make sure espresso beans are full'] },
    { name: 'Sanitizer', steps: ['Refresh red bucket + tablet', 'Use hot water', 'Place under espresso station',
      'Replace towels if dirty', 'Check sanitation level with indicator (more than 200 PPM)'] },
    { name: 'Ice & Water', steps: ['Refill water jars (water + ice)', 'Check ice bin level'] },
    { name: 'Trash Run', steps: ['If full, run trash (front & back)', 'Double bag all trash'] },
    { name: 'Mops Care', steps: ['Deep clean all floor mops and leave them outside to dry completely'] },
    { name: 'Dishes', steps: ['Wash, sanitize, and put away all dishes'] },
  ] },
  { id: 'closing', short: 'Closing', label: 'Closing Tasks', tasks: [
    { name: 'Bar & Equipment', steps: ['Clean dishes, oven trays, milk pitchers, and tongs',
      'Clean espresso machine (trained person only)', 'Wipe steam wands and drip tray', 'Clean Breville',
      'Empty and clean ice bin'] },
    { name: 'Cleaning', steps: ['Sweep and mop behind bar', 'Sweep lobby and check full floor',
      'Wipe all surfaces (bar, tables, counters)',
      'Clean bathroom fully (refill toilet paper; refill paper towels and soap; clean mirror, sink, floor, and trash area)'] },
    { name: 'Trash', steps: ['Take out all trash bins', 'Take out outside trash cans', 'Dump sani-water from red bucket'] },
    { name: 'Food & Drink', steps: ['Put away pastries in proper storage', 'Store hoji and matcha in the fridge',
      'Store the condensed milk in the fridge'] },
    { name: 'Store Reset', steps: ['Put away tip jar', 'Organize bar and lobby', 'Bring outdoor furniture inside',
      'Final wipe-down so store is clean for next day'] },
    { name: 'Systems Off', steps: ['Lights', 'AC', 'Oven', 'Dishwasher', 'Espresso grinders', 'Sandwich fridge light', 'Music'] },
    { name: 'Store Cold Brew', steps: ['Store cold brew in refrigerator (write date on the bottle)'] },
  ] },
];

const WEEKLY = {
  Monday: ['Sweep & mop FOH', 'Count cash tips'],
  Tuesday: ['Remove cups', 'Dust top of espresso machine'],
  Wednesday: ['Deep clean all drains'],
  Thursday: ['Deep clean all sinks'],
};

// ---- State (saved in the iPad's browser storage) ----
// pending: today's sign-offs, not yet sent. nights: days sent to the Owner Report by the Close button.
// unsent: nights the Google Sheet hasn't received yet; they go out as one week after Sunday's Finish.

const STORE_KEY = 'cafe-checklist-v2';
// breaks: today's break schedule, one row per person: [name, 10 min, lunch, 10 min].
const BREAK_COLUMNS = ['10 Min', 'Lunch Break', '10 Min'];
const BREAK_ROWS = 6; // same as the paper sheet
const emptyBreaks = () => ({ date: '', rows: Array.from({ length: BREAK_ROWS }, () => ['', '', '', '']) });
// log: today's check log extras, one row per time: [assigned to, notes].
// The Restroom and Lobby & Floor boxes are ordinary sign-offs, so they reach the report and sheet.
const emptyLog = () => ({ date: '', rows: LOG_TIMES.map(() => ['', '']) });
const emptyState = () => ({ pending: [], nights: [], unsent: [], employees: [...DEFAULT_EMPLOYEES], ownerCode: OWNER_CODE, breaks: emptyBreaks(), log: emptyLog(), initials: {} });
let state = load();
const openIds = new Set();
let renderedDay = '';
let renderedDate = '';

function load() {
  try {
    return { ...emptyState(), ...JSON.parse(localStorage.getItem(STORE_KEY)) };
  } catch {
    return emptyState();
  }
}
// Sign-offs are saved under full names, for the report and sheet. The main page shows initials.
// initials: set when an employee is added. Everyone else is worked out from their name.
function initialsOf(name) {
  if (state.initials[name]) return state.initials[name];
  const [first, second] = name.trim().split(/\s+/);
  return `${first[0]}${second ? second[0] : ''}`.toUpperCase();
}
const allInitials = names => names.split(' / ').map(initialsOf).join(' / ');

// Two people with the same initials: the newer one gets a number, like DK2.
function newInitials(first, last) {
  const base = `${first[0]}${last[0]}`.toUpperCase();
  const taken = state.employees.map(initialsOf);
  let result = base;
  for (let n = 2; taken.includes(result); n++) result = `${base}${n}`;
  return result;
}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// ---- Time (from the iPad's clock, which is synced over the network) ----

const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split('-'); return new Date(y, m - 1, d); };
const weekday = d => d.toLocaleDateString('en-US', { weekday: 'long' });
const dateLabel = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const timeLabel = d => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
// Times offered in the break schedule: every 30 minutes, 7:00 AM to 8:00 PM.
const BREAK_TIMES = Array.from({ length: 27 }, (_, i) => timeLabel(new Date(2000, 0, 1, 7, i * 30)));
const toMin = hhmm => { const [h, m] = hhmm.split(':'); return h * 60 + +m; };

function currentShift(d) {
  const m = d.getHours() * 60 + d.getMinutes();
  const s = SHIFT_TIMES.find(s => m >= toMin(s.start) && m < toMin(s.end));
  return s ? s.label : 'Closed';
}

function renderClock() {
  const d = new Date();
  $('#day').textContent = `${dateLabel(d)} · ${timeLabel(d)} · ${currentShift(d)}`;
}

// ---- Tasks ----

function sectionsFor(day) {
  const weekly = WEEKLY[day];
  if (!weekly) return SHIFTS;
  return [...SHIFTS, { id: 'weekly', short: 'Weekly', label: `Weekly Tasks — ${day}`,
    tasks: [{ name: day, steps: weekly, hideTitle: true }] }];
}

function signers(records, shift, task, step) {
  return records.filter(r => r.shift === shift && r.task === task && r.step === step);
}

function progress(day, records) {
  let total = 0, done = 0;
  for (const s of sectionsFor(day)) for (const t of s.tasks) for (const p of t.steps) {
    total++;
    if (signers(records, s.short, t.name, p).length) done++;
  }
  return { total, done };
}

// ---- Main page ----

// The night closed today, if any. While it exists the checklist is locked until 12:00 AM.
function closedToday() {
  const last = state.nights[state.nights.length - 1];
  return last && last.date === isoDate(new Date()) ? last : null;
}

function render() {
  renderedDay = weekday(new Date());
  renderedDate = isoDate(new Date());
  renderClock();
  const closed = closedToday();
  const records = closed ? closed.records : state.pending;
  const today = progress(renderedDay, records);
  $('#progress').textContent = `${today.done} of ${today.total} steps signed today`;
  $('#bar').style.width = `${today.done / today.total * 100}%`;

  const close = $('#close');
  close.disabled = !!closed;
  if (!close.dataset.armed) close.textContent = closed ? 'Day Finished' : 'Finish Day';

  $('#sections').innerHTML = (closed
    ? `<p class="notice">Today was finished at ${esc(closed.closedAt)}. The checklist opens again at 12:00 AM.</p>`
    : '') + sectionsFor(renderedDay).map((s, si) => {
    const steps = s.tasks.flatMap(t => t.steps.map(p => signers(records, s.short, t.name, p).length));
    const done = steps.filter(Boolean).length;
    return `<details class="section${done === steps.length && !s.repeats ? ' done' : ''}" data-id="${s.id}" ${openIds.has(s.id) ? 'open' : ''}>
      <summary><span class="label">${esc(s.label)}</span><span class="count">${done} of ${steps.length} signed</span></summary>
      ${s.tasks.map((t, ti) => {
        const rows = t.checkLog ? logBody(records, closed) : t.steps.map((p, pi) => {
          const names = [...new Set(signers(records, s.short, t.name, p).map(r => r.employee))];
          const at = `data-s="${si}" data-t="${ti}" data-p="${pi}"`;
          const chips = nameChips(records, s, t, p, at);
          return `<div class="step${s.repeats ? ' plain' : names.length ? ' done' : ''}">
            <button class="do name" ${at} ${closed ? 'disabled' : ''}>${esc(p)}</button>
            ${names.length
              ? `<div class="saved">${chips.join('')}</div>`
              : `<button class="do hint" ${at} ${closed ? 'disabled' : ''}>${closed ? 'Not signed' : 'Tap to sign'}</button>`}
          </div>`;
        }).join('');
        if (t.hideTitle) return `<div class="task"><div class="task-body">${rows}</div></div>`;
        const id = `${s.id}-${ti}`;
        const signed = t.steps.filter(p => signers(records, s.short, t.name, p).length).length;
        return `<details class="task${signed === t.steps.length && !s.repeats ? ' done' : ''}" data-id="${id}" ${openIds.has(id) ? 'open' : ''}>
          <summary>
            <span class="label">${esc(t.name)}</span>
            ${closed || t.checkLog ? '' : `<button class="check-off" data-s="${si}" data-t="${ti}">Sign all steps</button>`}
            <span class="count">${signed} of ${t.steps.length}</span>
          </summary>
          <div class="task-body">${rows}</div>
        </details>`;
      }).join('')}
    </details>`;
  }).flatMap((card, i) => (i === 2 ? [card, breakSection(closed)] : [card])).join(''); // after Closing
  renderReport();
}

// Name menu for one step, or for a whole task ("Sign all steps"). A ✓ means already signed.
function openMenu(btn, title, signed, onPick, alignRight, choices = state.employees, label = initialsOf) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="menu"><div class="head">${esc(title)}</div>${choices.map(e => {
    const done = signed.includes(e);
    return `<button data-name="${esc(e)}" class="${done ? 'done' : ''}"><span>${esc(e === 'Clear' ? e : label(e))}</span><span>${done ? '✓' : ''}</span></button>`;
  }).join('')}</div>`;
  document.body.appendChild(overlay);
  placeMenu(overlay.firstChild, btn, alignRight);

  overlay.addEventListener('click', e => {
    const b = e.target.closest('button[data-name]');
    if (b && b.classList.contains('done')) return;
    if (b) onPick(b.dataset.name);
    overlay.remove();
  });
}

// Popup from a name on a step: each time that person signed it. Remove is there until the day is finished.
function openTimes(chip, s, t, p, name) {
  const closed = closedToday();
  const rows = signers(closed ? closed.records : state.pending, s.short, t.name, p).filter(r => r.employee === name);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="menu"><div class="head">${esc(initialsOf(name))}</div>${rows.map(r => `<div class="time-row">
    <span>${esc(r.time)}</span>${closed ? '' : `<button data-time="${esc(r.time)}">Remove</button>`}</div>`).join('')}</div>`;
  document.body.appendChild(overlay);
  placeMenu(overlay.firstChild, chip);

  overlay.addEventListener('click', e => {
    const b = e.target.closest('button[data-time]');
    if (b) removeSignOff(s, t, p, name, b.dataset.time);
    if (b || e.target === overlay) overlay.remove();
  });
}

function placeMenu(menu, btn, alignRight) {
  menu.style.maxHeight = `${innerHeight - 20}px`;
  if (alignRight) menu.style.transformOrigin = 'top right';
  const r = btn.getBoundingClientRect();
  const top = r.bottom + 6 + menu.offsetHeight > innerHeight - 10 ? r.top - menu.offsetHeight - 6 : r.bottom + 6;
  const left = alignRight ? r.right - menu.offsetWidth : r.left;
  menu.style.top = `${Math.max(10, Math.min(top, innerHeight - menu.offsetHeight - 10))}px`;
  menu.style.left = `${Math.max(10, Math.min(left, innerWidth - menu.offsetWidth - 10))}px`;
}

// One tag per person on a step, with a ×count if they signed it more than once.
function nameChips(records, s, t, p, at) {
  const signed = signers(records, s.short, t.name, p).map(r => r.employee);
  return [...new Set(signed)].map(n => {
    const times = signed.filter(x => x === n).length;
    return `<button class="chip" ${at} data-name="${esc(n)}">${esc(initialsOf(n))}${times > 1 ? `<b>×${times}</b>` : ''}</button>`;
  });
}

// ---- Lobby / Restroom check log (filled in by hand; resets with the checklist) ----

const logRows = () => (state.log.date === isoDate(new Date()) ? state.log.rows : emptyLog().rows);

function logBody(records, closed) {
  const rows = closed ? closed.log || emptyLog().rows : logRows();
  const box = (r, a) => {
    const on = logChecks(records, r, a).length > 0;
    return `<td class="log-cell"><button class="log-check${on ? ' on' : ''}" data-r="${r}" data-a="${a}"
      aria-label="${esc(logStep(r, a))}" aria-pressed="${on}" ${closed ? 'disabled' : ''}>${on ? '✓' : ''}</button></td>`;
  };
  return `<div class="log-desc">${LOG_CHECKS.map(([area, checks]) => `<div><h4>${esc(area)}</h4>
      <ul>${checks.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`).join('')}</div>
    <p class="log-rule">Every 2 hours, tap both boxes after the check. Tap again to undo.</p>
    <div class="log-scroll"><table class="break-table log-table">
      <tr><th>Time</th><th>Assigned To</th>${LOG_AREAS.map(a => `<th>${esc(a)}</th>`).join('')}<th>Notes / Issues</th></tr>
      ${LOG_TIMES.map((time, r) => `<tr>
        <td class="log-time">${esc(time)}</td>
        <td><button class="break-cell log-assign${rows[r][0] ? '' : ' empty'}" data-r="${r}" ${closed ? 'disabled' : ''}>${rows[r][0] ? esc(allInitials(rows[r][0])) : closed ? '' : 'Name'}</button></td>
        ${LOG_AREAS.map((area, a) => box(r, a)).join('')}
        <td><input class="log-note" data-r="${r}" value="${esc(rows[r][1])}" aria-label="Notes for ${esc(time)}"
          autocomplete="off" ${closed ? 'disabled' : ''}></td>
      </tr>`).join('')}
    </table></div>`;
}

// A green box is a sign-off for whoever is assigned to that row, so it reaches the report and sheet.
const logStep = (r, a) => `${LOG_TIMES[r]} ${LOG_AREAS[a]}`;
const logChecks = (records, r, a) => records.filter(x => x.task === LOG_TASK && x.step === logStep(r, a));

function setLogCheck(r, a, time) {
  const step = logStep(r, a);
  state.pending = state.pending.filter(x => !(x.task === LOG_TASK && x.step === step));
  if (!time) return;
  const d = new Date();
  const assigned = logRows()[r][0];
  for (const employee of assigned ? assigned.split(' / ') : [UNASSIGNED]) {
    state.pending.push({ date: isoDate(d), day: weekday(d), shift: 'Mid-Shift', task: LOG_TASK, step, employee, time });
  }
}

function toggleLogCheck(r, a) {
  setLogCheck(r, a, logChecks(state.pending, r, a).length ? null : timeLabel(new Date()));
  save();
  render();
}

function saveLog(rows) {
  state.log = rows.flat().some(Boolean) ? { date: isoDate(new Date()), rows } : emptyLog();
  save();
}

// Assigned To can hold more than one person, like "ZP/MO" on paper.
function openAssignMenu(cell) {
  const r = +cell.dataset.r;
  const names = logRows()[r][0] ? logRows()[r][0].split(' / ') : [];
  openMenu(cell, `${LOG_TIMES[r]}: assigned to`, names, picked => {
    const rows = logRows();
    rows[r][0] = picked === 'Clear' ? '' : [...names, picked].join(' / ');
    saveLog(rows);
    // Boxes already green move to the new person, keeping the time they were checked.
    LOG_AREAS.forEach((area, a) => {
      const checked = logChecks(state.pending, r, a)[0];
      if (checked) setLogCheck(r, a, checked.time);
    });
    save();
    render();
  }, false, names.length ? ['Clear', ...state.employees] : state.employees);
}

// ---- Break schedule (filled in by hand each day; resets with the checklist) ----

const breakRows = () => (state.breaks.date === isoDate(new Date()) ? state.breaks.rows : emptyBreaks().rows);

function breakSection(closed) {
  const rows = closed ? closed.breaks || emptyBreaks().rows : breakRows();
  return `<details class="section" data-id="breaks" ${openIds.has('breaks') ? 'open' : ''}>
    <summary><span class="label">Break Schedule</span>
      <span class="count">${rows.filter(r => r[0]).length} scheduled</span></summary>
    <div class="break-wrap">
      <table class="break-table">
        <tr>${['Name', ...BREAK_COLUMNS].map((title, c) => `<th><button
          class="break-head" data-c="${c}" ${closed ? 'disabled' : ''}>${esc(title)}</button></th>`).join('')}</tr>
        ${rows.map((row, r) => `<tr>${row.map((value, c) => `<td><button
          class="break-cell${value ? '' : ' empty'}" data-r="${r}" data-c="${c}" ${closed ? 'disabled' : ''}>${value ? esc(c ? value : initialsOf(value)) : closed ? '' : c ? 'Time' : 'Name'}</button></td>`).join('')}</tr>`).join('')}
      </table>
      <p class="break-note">Restroom gets a check right after every lunch break.</p>
    </div>
  </details>`;
}

function saveBreaks(rows) {
  state.breaks = rows.flat().some(Boolean) ? { date: isoDate(new Date()), rows } : emptyBreaks();
  save();
  render();
}

function setBreak(r, c, value) {
  const rows = breakRows();
  rows[r][c] = value;
  saveBreaks(rows);
}

// Tapping a column title twice clears that whole column.
function clearBreakColumn(c) {
  const rows = breakRows();
  rows.forEach(row => { row[c] = ''; });
  saveBreaks(rows);
}

function openBreakMenu(cell) {
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const value = breakRows()[r][c];
  const choices = c ? BREAK_TIMES : state.employees;
  const title = c ? BREAK_COLUMNS[c - 1] : 'Name';
  openMenu(cell, title, value ? [value] : [], picked => setBreak(r, c, picked === 'Clear' ? '' : picked),
    false, value ? ['Clear', ...choices] : choices, c ? time => time : initialsOf);
}

function signOff(s, t, steps, employee) {
  const d = new Date();
  for (const p of steps) {
    // Mid-Shift tasks repeat, so the same person can sign again. Everything else is once a day.
    if (!s.repeats && signers(state.pending, s.short, t.name, p).some(r => r.employee === employee)) continue;
    state.pending.push({
      date: isoDate(d), day: weekday(d), shift: s.short, task: t.name, step: p, employee, time: timeLabel(d),
    });
  }
  save();
  render();
}

// Removes one sign-off: a person can have several on a Mid-Shift step.
function removeSignOff(s, t, p, employee, time) {
  const i = state.pending.findIndex(r =>
    r.shift === s.short && r.task === t.name && r.step === p && r.employee === employee && r.time === time);
  if (i >= 0) state.pending.splice(i, 1);
  save();
  render();
}

// ---- Google Sheet (one tab per week, Monday to Sunday, sent after Sunday's Finish) ----

const mondayOf = iso => {
  const d = fromIso(iso);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return isoDate(d);
};

// A week goes out once Sunday is finished, or once it's over if nobody finished Sunday.
function weekIsDue(monday) {
  return mondayOf(isoDate(new Date())) !== monday
    || state.nights.some(n => n.day === 'Sunday' && mondayOf(n.date) === monday);
}

// One row per step, so the sheet shows unsigned steps too.
function sheetRows(night) {
  const rows = [];
  for (const s of sectionsFor(night.day)) for (const t of s.tasks) for (const step of t.steps) {
    const signed = signers(night.records, s.short, t.name, step);
    if (!signed.length) rows.push([night.date, night.day, s.short, t.name, step, 'Not signed', '', night.closedAt]);
    for (const r of signed) rows.push([night.date, night.day, s.short, t.name, step, r.employee, r.time, night.closedAt]);
  }
  for (const [name, ...times] of night.breaks || []) times.forEach((time, i) => {
    if (time) rows.push([night.date, night.day, 'Break Schedule', BREAK_COLUMNS[i], '', name || 'No name', time, night.closedAt]);
  });
  (night.log || []).forEach(([assigned, notes], i) => {
    if (assigned) rows.push([night.date, night.day, 'Mid-Shift', LOG_TASK, `${LOG_TIMES[i]} Assigned to`, assigned, '', night.closedAt]);
    if (notes) rows.push([night.date, night.day, 'Mid-Shift', LOG_TASK, `${LOG_TIMES[i]} Notes: ${notes}`, '', '', night.closedAt]);
  });
  return rows;
}

let flushing = false;
async function flushSheet() {
  if (!SHEET_URL || flushing) return;
  flushing = true;
  for (const monday of new Set(state.unsent.map(n => mondayOf(n.date)))) {
    if (!weekIsDue(monday)) continue;
    // Always the whole week, so resending after "Undo finish" replaces the tab cleanly.
    const nights = state.nights.filter(n => mondayOf(n.date) === monday);
    try {
      // no-cors: the browser can't read Google's reply, so any answer from the server counts as sent.
      await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors',
        body: JSON.stringify({ tab: `Week of ${monday}`, rows: nights.flatMap(sheetRows) }) });
    } catch {
      break; // offline; try again later
    }
    state.unsent = state.unsent.filter(n => mondayOf(n.date) !== monday);
    save();
  }
  flushing = false;
  renderReport();
}

// Any day not finished by 12:00 AM finishes itself with whatever was signed off. Runs on opening
// the app as well as on the clock, so it still works if the iPad was asleep at midnight.
function autoFinish() {
  const today = isoDate(new Date());
  const dates = [...new Set([...state.pending.map(r => r.date), state.breaks.date, state.log.date])]
    .filter(d => d && d !== today).sort();
  if (!dates.length) return;
  for (const date of dates) {
    const night = { date, day: weekday(fromIso(date)), closedAt: '12:00 AM (automatic)',
      records: state.pending.filter(r => r.date === date),
      breaks: state.breaks.date === date ? state.breaks.rows : emptyBreaks().rows,
      log: state.log.date === date ? state.log.rows : emptyLog().rows };
    state.nights.push(night);
    state.unsent.push(night);
  }
  state.pending = state.pending.filter(r => r.date === today);
  if (state.breaks.date !== today) state.breaks = emptyBreaks();
  if (state.log.date !== today) state.log = emptyLog();
  save();
}

// ---- Owner report page (one entry per night, added by the Close button) ----

function renderReport() {
  $('#sheet-status').textContent = !SHEET_URL
    ? 'Google Sheet: not connected yet.'
    : state.unsent.length
      ? `Google Sheet: ${state.unsent.length} ${state.unsent.length === 1 ? 'day' : 'days'} waiting. The week sends after Sunday's Finish.`
      : 'Google Sheet: up to date.';

  const all = state.nights.flatMap(n => n.records).filter(r => r.employee !== UNASSIGNED);
  // People who were removed but have past sign-offs still show up, marked "(former)".
  const former = [...new Set(all.map(r => r.employee))].filter(e => !state.employees.includes(e));
  const byEmployee = [...state.employees, ...former].map(e => {
    const rows = all.filter(r => r.employee === e);
    return { e, label: former.includes(e) ? `${e} (former)` : e, count: rows.length, nights: new Set(rows.map(r => r.date)).size };
  }).sort((a, b) => b.count - a.count);

  // Missed steps are only counted for the whole team: without a schedule, nobody knows
  // whose step it was. Square shifts would make this per person.
  const team = state.nights.map(n => progress(n.day, n.records));
  const done = team.reduce((sum, p) => sum + p.done, 0);
  const total = team.reduce((sum, p) => sum + p.total, 0);

  const closed = closedToday();
  $('#report').innerHTML = `
    ${closed ? `<p class="notice">Today was finished at ${esc(closed.closedAt)}. If that was a mistake, undo it to reopen the checklist.</p>
      <div class="actions"><button id="undo-close">Undo finish</button></div>` : ''}

    <div class="stats">
      <div><b>${total ? `${Math.round(done / total * 100)}%` : '—'}</b><span>Steps signed</span></div>
      <div><b>${total - done}</b><span>Steps missed</span></div>
      <div><b>${state.nights.length}</b><span>Days reported</span></div>
    </div>

    <h2>Sign-offs by employee</h2>
    <div class="card"><table><tr><th>Employee</th><th>Sign-offs</th><th>Days</th><th>Share</th></tr>
      ${byEmployee.map(x => `<tr><td>${esc(x.label)}</td><td>${x.count}</td><td>${x.nights}</td>
        <td>${all.length ? Math.round(x.count / all.length * 100) : 0}%</td></tr>`).join('')}
    </table></div>

    <h2>Days</h2>
    ${state.nights.length
      ? state.nights.map((n, i) => nightReport(n, i)).reverse().join('')
      : '<p>No days finished yet. Each day shows up here after Finish, or at 12:00 AM if nobody taps it.</p>'}

    <h2>Settings</h2>
    <details class="section" data-id="employees" ${openIds.has('employees') ? 'open' : ''}>
      <summary><span class="label">Employees</span><span class="count">${state.employees.length} people</span></summary>
      <div class="report-body">
        <form id="add-employee" class="add-row">
          <input id="first-name" type="text" placeholder="First name" aria-label="First name"
            autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false">
          <input id="last-name" type="text" placeholder="Last name" aria-label="Last name"
            autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false">
          <button type="submit">Add</button>
        </form>
        ${state.employees.map(e => `<div class="emp"><span>${esc(e)} (${esc(initialsOf(e))})</span>
          <button class="remove-emp" data-name="${esc(e)}">Remove</button></div>`).join('')}
      </div>
    </details>
    <div class="actions"><button id="change-code">Change passcode</button></div>`;
}

function nightReport(night, i) {
  const p = progress(night.day, night.records);
  const id = `night-${i}`;
  return `<details class="section" data-id="${id}" ${openIds.has(id) ? 'open' : ''}>
    <summary><span class="label">${esc(dateLabel(fromIso(night.date)))} — finished ${esc(night.closedAt)}</span>
      <span class="count">${p.done} of ${p.total} signed</span></summary>
    <div class="report-body">
      ${sectionsFor(night.day).map(s => `<h4>${esc(s.short)}</h4>
        <table><tr><th>Task</th><th>Step</th><th>Signed by</th></tr>
          ${s.tasks.flatMap(t => t.steps.map(step => {
            const rows = signers(night.records, s.short, t.name, step);
            return `<tr><td>${t.hideTitle ? '' : esc(t.name)}</td><td>${esc(step)}</td>
              <td>${rows.length ? rows.map(r => `${esc(r.employee)} (${esc(r.time)})`).join(', ') : '<i>Not signed</i>'}</td></tr>`;
          })).join('')}
        </table>`).join('')}
      ${(night.log || []).flat().some(Boolean) ? `<h4>Check Log</h4>
        <table><tr><th>Time</th><th>Assigned To</th><th>Notes / Issues</th></tr>
          ${night.log.map(([assigned, notes], r) => (assigned || notes
            ? `<tr><td>${esc(LOG_TIMES[r])}</td><td>${esc(assigned)}</td><td>${esc(notes)}</td></tr>` : '')).join('')}
        </table>` : ''}
      ${(night.breaks || []).flat().some(Boolean) ? `<h4>Break Schedule</h4>
        <table><tr><th>Name</th>${BREAK_COLUMNS.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
          ${night.breaks.filter(r => r.some(Boolean)).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}
        </table>` : ''}
    </div>
  </details>`;
}

// ---- Owner passcode ----

// Four-digit keypad. check(code) says if the code is accepted; a wrong one shakes and clears.
// done(code) runs after the keypad closes.
function openKeypad(title, check, done) {
  let code = '';
  let busy = false;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="passcode">
    <h2>${esc(title)}</h2>
    <div class="dots">${'<span></span>'.repeat(OWNER_CODE.length)}</div>
    <div class="keys">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-key="${k}">${k}</button>`).join('')}
      <button class="text" data-key="cancel">Cancel</button>
      <button data-key="0">0</button>
      <button class="text" data-key="delete">Delete</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const dots = overlay.querySelector('.dots');
  const showDots = () => dots.querySelectorAll('span').forEach((d, i) => d.classList.toggle('on', i < code.length));

  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  const press = key => {
    if (key === 'cancel') return close();
    if (busy) return;
    if (key === 'delete') code = code.slice(0, -1);
    else if (code.length < OWNER_CODE.length) code += key;
    showDots();
    if (code.length < OWNER_CODE.length) return;
    busy = true;
    if (check(code)) {
      setTimeout(() => { close(); done(code); }, 150);
    } else {
      dots.classList.add('shake');
      setTimeout(() => { dots.classList.remove('shake'); code = ''; busy = false; showDots(); }, 400);
    }
  };
  const onKey = e => {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    if (e.key === 'Backspace') press('delete');
    if (e.key === 'Escape') press('cancel');
  };

  overlay.addEventListener('click', e => {
    const b = e.target.closest('button[data-key]');
    if (b) press(b.dataset.key);
    else if (e.target === overlay) close();
  });
  document.addEventListener('keydown', onKey);
}

function openPasscode() {
  openKeypad('Enter Owner Passcode',
    code => code === state.ownerCode || code === DEVELOPER_CODE,
    () => showOwnerPage(true));
}

function changePasscode() {
  openKeypad('Enter New Passcode', () => true, first =>
    openKeypad('Enter New Passcode Again', code => code === first, code => {
      state.ownerCode = code;
      save();
      toast('Passcode changed.');
    }));
}

function showOwnerPage(show) {
  document.body.classList.toggle('owner-mode', show);
  $('#owner').textContent = show ? 'Back to Checklist' : 'Owner';
  if (show) renderReport();
  scrollTo(0, 0);
}

// ---- Two-tap buttons (no pop-up dialogs, so nothing blocks the iPad) ----

function twoTap(btn, prompt, action) {
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    action();
    return;
  }
  const original = btn.textContent;
  btn.dataset.armed = '1';
  btn.textContent = prompt;
  setTimeout(() => {
    if (!btn.isConnected || !btn.dataset.armed) return;
    delete btn.dataset.armed;
    btn.textContent = original;
  }, 3000);
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

// ---- Events ----

document.addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  if (e.target.open) return openIds.add(id);
  openIds.delete(id);
  // Closing a shift also closes the tasks inside it.
  e.target.querySelectorAll('details.task').forEach(task => {
    task.open = false;
    openIds.delete(task.dataset.id);
  });
}, true);

// Notes save as they're typed. No redraw, or the keyboard would close.
$('#sections').addEventListener('input', e => {
  if (!e.target.classList.contains('log-note')) return;
  const rows = logRows();
  rows[+e.target.dataset.r][1] = e.target.value;
  saveLog(rows);
});

$('#sections').addEventListener('click', e => {
  const check = e.target.closest('.log-check');
  if (check) return toggleLogCheck(+check.dataset.r, +check.dataset.a);
  const assign = e.target.closest('.log-assign');
  if (assign) return openAssignMenu(assign);
  const cell = e.target.closest('.break-cell');
  if (cell) return openBreakMenu(cell);
  const head = e.target.closest('.break-head');
  if (head) return twoTap(head, 'Tap again to clear', () => clearBreakColumn(+head.dataset.c));
  const el = e.target.closest('[data-s]');
  if (!el) return;
  const s = sectionsFor(renderedDay)[el.dataset.s];
  const t = s.tasks[el.dataset.t];
  const p = t.steps[el.dataset.p];

  if (el.classList.contains('chip')) return openTimes(el, s, t, p, el.dataset.name);
  if (closedToday()) return;

  if (el.classList.contains('do')) {
    const signedStep = s.repeats ? [] : signers(state.pending, s.short, t.name, p).map(r => r.employee);
    openMenu(el, p, signedStep, name => signOff(s, t, [p], name));
  } else if (el.classList.contains('check-off')) {
    e.preventDefault(); // it sits on the dropdown's title row; don't close the dropdown
    // ✓ only for people already signed on every step of this task.
    const signedAll = s.repeats ? [] : state.employees.filter(e => t.steps.every(step =>
      signers(state.pending, s.short, t.name, step).some(r => r.employee === e)));
    openMenu(el, `${t.name}: sign all steps`, signedAll, name => signOff(s, t, t.steps, name), true);
  }
});

$('#report').addEventListener('click', e => {
  if (e.target.id === 'undo-close') twoTap(e.target, 'Tap again to undo', undoClose);
  if (e.target.id === 'change-code') changePasscode();
  if (e.target.classList.contains('remove-emp')) {
    const name = e.target.dataset.name;
    twoTap(e.target, 'Tap again to remove', () => {
      state.employees = state.employees.filter(x => x !== name);
      save();
      render();
      toast(`${name} removed. Their past sign-offs stay in the report.`);
    });
  }
});

$('#report').addEventListener('submit', e => {
  e.preventDefault();
  const first = $('#first-name').value.trim().replace(/\s+/g, ' ');
  const last = $('#last-name').value.trim().replace(/\s+/g, ' ');
  if (!first || !last) return toast('Enter a first and last name.');
  const name = `${first} ${last}`;
  const existing = state.employees.find(x => x.toLowerCase() === name.toLowerCase());
  if (existing) return toast(`${existing} is already on the list.`);
  state.initials[name] = newInitials(first, last);
  state.employees.push(name);
  save();
  render();
  toast(`${name} added as ${state.initials[name]}.`);
});

$('#owner').addEventListener('click', () => {
  if (document.body.classList.contains('owner-mode')) showOwnerPage(false);
  else openPasscode();
});

// Owner only: reopen today's checklist with everyone's names put back.
// If the Google Sheet already got this week, finishing again replaces that week's tab.
function undoClose() {
  const night = closedToday();
  if (!night) return;
  state.nights.pop();
  state.unsent = state.unsent.filter(u => !(u.date === night.date && u.closedAt === night.closedAt));
  state.pending = [...night.records, ...state.pending];
  if (night.breaks) state.breaks = { date: night.date, rows: night.breaks };
  if (night.log) state.log = { date: night.date, rows: night.log };
  save();
  render();
  toast('Finish undone. The checklist is open again.');
}

$('#close').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (closedToday()) return;
  twoTap(btn, 'Tap again to finish today', () => {
    autoFinish(); // in case midnight just passed and the clock hasn't caught up
    const d = new Date();
    const night = { date: isoDate(d), day: weekday(d), closedAt: timeLabel(d), records: state.pending, breaks: breakRows(), log: logRows() };
    state.nights.push(night);
    state.unsent.push(night);
    state.pending = [];
    state.breaks = emptyBreaks();
    state.log = emptyLog();
    save();
    flushSheet();
    openIds.clear();
    render();
    scrollTo(0, 0);
    toast(`Sent ${night.records.length} sign-offs to the owners.`);
  });
});

// Keep the clock current. At 12:00 AM: finish the day if nobody did, then redraw for the new day
// (unlocks the checklist, and weekly tasks differ by day).
setInterval(() => {
  if (isoDate(new Date()) === renderedDate) return renderClock();
  autoFinish();
  render();
  flushSheet();
}, 15000);

// Retry any nights the Google Sheet missed, whenever the iPad is back online.
addEventListener('online', flushSheet);

autoFinish();
render();
flushSheet();
</script>
</body>
